name: Publish NNN board
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare engine-only page
        run: |
          unzip -q nnn-board.zip -d site
          python3 - <<'PY'
          from pathlib import Path
          import re




          bundle = Path('site/_next/static/immutable/chunks/0d76mczvsbu73.js')
          source = bundle.read_text()
          start = source.index('let K=(0,t.jsxs)(t.Fragment,{children:[(0,t.jsx)(sr.f,{label:"Вид доски"')
          end = source.index('return(0,t.jsxs)("div",{className:', start)
          source = source[:start] + source[end:]
          start = source.index(',right:(0,t.jsx)("div",{className:"hidden items-center gap-2 lg:flex",children:K})')
          end = source.index('children:K})', start + len(',right:(0,t.jsx)("div",{className:"hidden items-center gap-2 lg:flex",children:K})')) + len('children:K})')
          source = source[:start] + source[end:]
          assert source.count('[A,I]=(0,l.useState)(!0)') == 1
          source = source.replace('[A,I]=(0,l.useState)(!0)', '[A,I]=(0,l.useState)(!1)')
          source = source.replace('null!==e&&m("board")', 'null!==e&&m("engine")')
          marker = 'tY.map((s,l)=>(0,t.jsx)(ss,'
          assert source.count(marker) == 1
          source = source.replace(marker, 'tY.map((s,l)=>(s.label==="1Win"||s.label==="B2C")?null:(0,t.jsx)(ss,')
          stage = '[c,o]=(0,l.useState)(0),[h,m]=(0,l.useState)(!0),p=(0,l.useRef)(0),f=tD[c].year'
          assert source.count(stage) == 1
          source = source.replace(stage, '[c,o]=(0,l.useState)(tO),[h,m]=(0,l.useState)(!1),p=(0,l.useRef)(tO),f=tD[c].year')
          panel = source.index('function eO({id:e,onClose:l})')
          start = source.index('children:a.phrase', panel)
          tail = source.index(',a.facts.length', start)
          end = source.index('function eL(', tail)
          summary = "(e===\"dependency\"?({\"access\":\"Если провайдер блокирует аккаунт или отрасль, NNN может перенаправить допустимые задачи другому поставщику.\",\"policy\":\"Если правила в регионе меняются, NNN может перенести допустимые задачи в регион, где их можно выполнять.\",\"physical\":\"Если дата-центр выходит из строя, задачи можно перенести на резервные площадки.\",\"market\":\"Если поставщик прекращает работу, сеть может перераспределить задачи между другими поставщиками.\",\"product\":\"Если провайдер снимает или меняет модель, NNN может использовать доступную версию на другой площадке.\"})[riskCategory]:({\"clubs\":\"Клубы сдают простаивающие видеокарты. NNN платит за часы работы и отдаёт им пакетные задачи. Доля в модели на 2031 год — 12%.\",\"homes\":\"Владельцы подключают домашние GPU и получают оплату за работу. В модели на 2031 год — около 6 800 узлов и 55% вычислительной нагрузки.\",\"dc\":\"Дата-центры покрывают старт, пики нагрузки и приватные задачи. В модели на 2031 год — 28% вычислительной нагрузки.\",\"telco\":\"С 2030 года NNN планирует подключать свободные мощности телекомов и государственных площадок. Доля в модели на 2031 год — 5%.\",\"network\":\"Движок выбирает, где выполнить задачу, по цене, доступности и требованиям к данным. Если узел отключается, задачу можно перенести на другой.\",\"affiliates\":\"Партнёрские программы получают фабрику креативов под своим брендом. В модели на 2031 год — $12,3 млн выручки от внешних партнёрок.\",\"independence\":\"Компании получают доступ к моделям через один API. При сбое задачи можно перенести к другому поставщику. В модели на 2031 год — $21,7 млн выручки.\",\"b2b\":\"Пакетная обработка документов и аудио использует свободные мощности. В модели на 2031 год — $3,4 млн выручки.\",\"token\":\"По плану 10% выручки от заказа направляется на выкуп и сжигание токена. Владельцам GPU платят деньгами, токен служит бонусом.\"})[e])??a.phrase"
          source = source[:start] + source[start:tail].replace('children:a.phrase', 'children:' + summary) + ']})]})}' + source[end:]
          source = source.replace('function eO({id:e,onClose:l}){let a=', 'function eO({id:e,onClose:l}){let {riskCat:riskCategory}=x(),a=', 1)
          bundle.write_text(source)
          page = Path('site/index.html')
          html = page.read_text().replace('<html lang="ru"', '<html lang="ru" translate="no"')
          html = html.replace('</head>', '<meta name="google" content="notranslate"></head>', 1)
          versioned = bundle.with_name('nnn-engine-v5.js')
          bundle.rename(versioned)
          html = html.replace(bundle.name, versioned.name)
          html = html.replace('</head>', '<style>div:has(>[aria-label="Вид доски"]),div[class="absolute inset-0 z-[60] flex items-center justify-center bg-black/40 p-4 backdrop-blur-[2px]"]{display:none!important}</style></head>', 1)
          html = html.replace('</head>', '<style>.eng div.flex.flex-col:has(button[aria-label="Проиграть рост"]),.eng div.pointer-events-none button.group.text-center{display:none!important}</style></head>', 1)
          page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
